name: ✏️ Modifier un set suivi
description: Change le seuil d'alerte et/ou la collection d'un set déjà suivi, sans toucher à l'Excel.
title: '[Modification] '
labels:
- modification-set
body:
- type: markdown
  attributes:
    value: 'Remplis uniquement les champs que tu veux changer — laisse le reste tel quel

      ("Ne pas modifier" pour la collection, champ vide pour le prix d''alerte).

      '
- type: dropdown
  id: id_set
  attributes:
    label: Set à modifier
    description: Liste régénérée automatiquement à chaque changement de config.
    options:
    - 10300 — La machine à remonter le temps de Retour vers le futur
    - 10321 — Corvette
    - 10339 — Le bureau de poste du Père Noël
    - 10361 — Le train de Noël
    - 10365 — Le bateau pirate du capitaine Jack Sparrow
    - 10370 — L’étoile de Noël
    - 10372 — Hibiscus
    - '11370 — Stranger Things : la Maison Creel'
    - 11376 — Ford Model T
    - 11383 — Le manoir du maire
    - 21338 — La maison en A
    - 21351 — L'Étrange Noël de Monsieur Jack - Disney Tim Burton
    - 40975 — Château de Poudlard miniature
    - 42232 — Megacar Sadair's Spear de Koenigsegg
    - 45200 — Kit de science Mission lunaire
    - 45201 — Kit de science Animaux de l’Antarctique
    - 80121 — L’auberge traditionnelle du clair de lune
    - LUMI-LUNA — Luna Cottage
  validations:
    required: true
- type: input
  id: prix_alerte
  attributes:
    label: Prix d'alerte (laisser vide = ne pas changer)
    description: 'Un nombre pour définir/changer le seuil (ex: 45), le mot ''aucun'' pour le supprimer, ou vide pour ne rien changer.'
    placeholder: '45'
  validations:
    required: false
- type: dropdown
  id: collection
  attributes:
    label: Collection (laisser sur 'Ne pas modifier' pour ne rien changer)
    options:
    - Ne pas modifier
    - Architecture
    - Art
    - The Botanical Collection
    - Creator 3-en-1
    - Disney™
    - Harry Potter™
    - LEGO® Icons
    - Ideas
    - One Piece
    - Speed Champions
    - Star Wars™
    - LEGO® Super Mario™
    - Technic
    - LEGO® Education
    - Autre thème (précise-le dans le champ suivant)
    default: 0
  validations:
    required: false
- type: input
  id: collection_autre
  attributes:
    label: Nom de la collection (si 'Autre thème' choisi ci-dessus)
    placeholder: 'ex: Ninjago'
  validations:
    required: false
- type: input
  id: url_idealo
  attributes:
    label: URL Idealo (laisser vide = ne pas changer)
    description: Pour les marques hors LEGO (Lumibricks, etc.) suivies via Idealo plutôt que via Avenue de la Brique.
  validations:
    required: false

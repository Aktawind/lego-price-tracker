name: "➕ Ajouter un set à suivre"
description: "Ajoute un set LEGO (ou d'une autre marque) au suivi de prix quotidien."
title: "[Ajout] "
labels: ["ajout-set"]
body:
  - type: markdown
    attributes:
      value: |
        Remplis ce formulaire pour ajouter un nouveau set au suivi. Pour un set **LEGO**,
        seul l'ID du set suffit en général : le nom, l'image et le nombre de pièces sont
        récupérés automatiquement sur Lego.com. La **collection**, elle, se choisit dans
        le menu déroulant ci-dessous — la détection automatique sur Lego.com n'est pas
        fiable (le design du site change trop souvent), donc autant la préciser toi-même.

        Pour une **autre marque** (ex: Lumibricks), remplis aussi le nom, l'image et le
        lien Amazon à la main, car il n'y a pas de fiche Lego.com à consulter.

  - type: dropdown
    id: marque
    attributes:
      label: Marque
      description: "Laisse 'LEGO' pour un set officiel LEGO."
      options:
        - "LEGO"
        - "Lumibricks"
        - "Autre (précise le nom dans 'Nom du set')"
      default: 0
    validations:
      required: true

  - type: input
    id: id_set
    attributes:
      label: "ID_Set (référence unique)"
      description: "Pour LEGO : le numéro du set (ex: 10321). Pour une autre marque : un identifiant court et unique que tu choisis (ex: LUMI-70001), lettres/chiffres/- /_ uniquement."
      placeholder: "10321"
    validations:
      required: true

  - type: input
    id: nom_set
    attributes:
      label: "Nom du set"
      description: "Obligatoire si la marque n'est pas LEGO (sinon récupéré automatiquement)."
      placeholder: "Corvette"
    validations:
      required: false

  - type: dropdown
    id: collection
    attributes:
      label: "Collection (uniquement pour un set LEGO)"
      description: "Sert à calculer si c'est une bonne affaire (prix moyen à la pièce par gamme). Laisse sur la première option si tu ne sais pas ou si la marque n'est pas LEGO."
      options:
        - "Je ne sais pas / laisser la détection automatique essayer"
        - "Architecture"
        - "Art"
        - "The Botanical Collection"
        - "Creator 3-en-1"
        - "Disney™"
        - "Harry Potter™"
        - "LEGO® Icons"
        - "Ideas"
        - "One Piece"
        - "Speed Champions"
        - "Star Wars™"
        - "LEGO® Super Mario™"
        - "Technic"
        - "LEGO® Education"
        - "Autre thème (précise-le dans le champ suivant)"
      default: 0
    validations:
      required: false

  - type: input
    id: collection_autre
    attributes:
      label: "Nom de la collection (si 'Autre thème' choisi ci-dessus)"
      placeholder: "ex: Ninjago"
    validations:
      required: false

  - type: input
    id: nb_pieces
    attributes:
      label: "Nombre de pièces"
      description: "Optionnel pour LEGO (auto-détecté). Utile pour les autres marques."
      placeholder: "1210"
    validations:
      required: false

  - type: input
    id: image_url
    attributes:
      label: "Image_URL"
      description: "Obligatoire si la marque n'est pas LEGO (lien direct vers une image du produit)."
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: url_lego
    attributes:
      label: "URL Lego.com"
      description: "Optionnel : uniquement si tu veux forcer une URL précise (sinon auto-détectée pour les sets LEGO)."
    validations:
      required: false

  - type: input
    id: url_amazon
    attributes:
      label: "URL Amazon"
      description: "Recommandé pour les marques hors LEGO (Lumibricks, etc.)."
    validations:
      required: false

  - type: input
    id: url_auchan
    attributes:
      label: "URL Auchan"
    validations:
      required: false

  - type: input
    id: url_leclerc
    attributes:
      label: "URL Leclerc"
    validations:
      required: false

  - type: input
    id: url_carrefour
    attributes:
      label: "URL Carrefour"
    validations:
      required: false

  - type: input
    id: url_avenue
    attributes:
      label: "URL Avenue de la Brique"
      description: "Optionnel : si tu as déjà la page du set sur avenuedelabrique.com."
    validations:
      required: false

  - type: input
    id: prix_alerte
    attributes:
      label: "Prix d'alerte (optionnel)"
      description: "Tu ne seras notifié que si le prix passe SOUS ce montant. Laisse vide pour être alerté dès la moindre baisse."
      placeholder: "45"
    validations:
      required: false
